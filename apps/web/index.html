<!DOCTYPE html>
<html lang="ne">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts: connect early and load in parallel with the app (a CSS @import would wait for the CSS first). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wdth,wght@75..125,400..800&family=Mukta:wght@400;500;600;700&display=swap"
    />
    <link rel="alternate" type="application/rss+xml" title="हाम्रो नेपाल" href="%SITE_URL%/rss.xml" />
    <meta name="theme-color" content="#c8102e" />
    
    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="हाम्रो नेपाल - नेपालको विश्वसनीय समाचार पोर्टल। राजनीति, अर्थतन्त्र, खेलकुद, मनोरञ्जन र अन्य विविध समाचारहरू।"
    />
    <meta
      name="keywords"
      content="नेपाल, समाचार, न्युज, राजनीति, अर्थतन्त्र, खेलकुद, हाम्रो नेपाल, Nepali news, Nepal news portal"
    />
    <meta name="author" content="हाम्रो नेपाल" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="हाम्रो नेपाल - नेपालको विश्वसनीय समाचार पोर्टल" />
    <meta property="og:description" content="राजनीति, अर्थतन्त्र, खेलकुद, मनोरञ्जन र अन्य विविध समाचारहरू। नेपालको भरपर्दो समाचार स्रोत।" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ne_NP" />
    <meta property="og:site_name" content="हाम्रो नेपाल" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%SITE_URL%/" />
    <meta name="twitter:title" content="हाम्रो नेपाल - नेपालको विश्वसनीय समाचार पोर्टल" />
    <meta name="twitter:description" content="राजनीति, अर्थतन्त्र, खेलकुद, मनोरञ्जन र विविध समाचारहरू।" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    
    <!-- Who publishes the site, and its search (Google's sitelinks search box). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "NewsMediaOrganization",
            "@id": "%SITE_URL%/#organization",
            "name": "हाम्रो नेपाल",
            "alternateName": "Hamro Nepal",
            "url": "%SITE_URL%/",
            "logo": { "@type": "ImageObject", "url": "%SITE_URL%/brand/logo-square.png" }
          },
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "हाम्रो नेपाल",
            "inLanguage": ["ne", "en"],
            "publisher": { "@id": "%SITE_URL%/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "%SITE_URL%/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- The site's colours (Dashboard → साइट सेटिङ), cached from the last visit, before the page draws. -->
    <script>
      try {
        var hn = JSON.parse(localStorage.getItem("hn_site_settings") || "null");
        if (hn && hn.colors) {
          var dk = function (h, a) {
            var n = parseInt(h.slice(1), 16);
            return "#" + [n >> 16, (n >> 8) & 255, n & 255].map(function (c) { return Math.round(c * (1 - a)).toString(16).padStart(2, "0"); }).join("");
          };
          var st = document.documentElement.style, c = hn.colors;
          st.setProperty("--color-primary", c.primary);
          st.setProperty("--color-primary-dark", dk(c.primary, 0.2));
          st.setProperty("--color-secondary", c.secondary);
          st.setProperty("--color-secondary-dark", dk(c.secondary, 0.25));
          st.setProperty("--color-ink", c.ink);
        }
      } catch (e) {}
    </script>
    <title>हाम्रो नेपाल - नेपालको विश्वसनीय समाचार पोर्टल</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
