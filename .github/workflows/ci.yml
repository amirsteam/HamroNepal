name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (shared, api, web)
        run: npm run typecheck
      - name: API tests (in-memory MongoDB)
        run: npm test -w apps/api
      - name: Build
        run: npm run build
      # Vercel's function loader can't require() ES-module-only packages, which
      # Node 22+ allows locally. Load the built API the strict way to catch it.
      - name: API bundle loads like on Vercel
        run: node --no-experimental-require-module -e "import('./apps/api/dist/index.mjs').then((m) => { if (typeof m.default !== 'function') process.exit(1); })"
