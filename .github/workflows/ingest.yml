name: AI news ingest

# Every hour: read Nepali RSS feeds, sort stories into topic + location
# menus with AI, and save short attributed drafts as "pending" for editors.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (classify and write, but save nothing)"
        type: boolean
        default: false
      max:
        description: "Maximum drafts this run"
        default: "10"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run ingest
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Photos are uploaded to Cloudinary together with each draft.
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          AI_PRIMARY_MODEL: ${{ vars.AI_PRIMARY_MODEL || 'gemini-flash-lite-latest' }}
          AI_FALLBACK_MODEL: ${{ vars.AI_FALLBACK_MODEL || 'openai/gpt-oss-120b' }}
          INGEST_MAX_PER_CATEGORY: ${{ vars.INGEST_MAX_PER_CATEGORY || '3' }}
          INGEST_MIN_CONFIDENCE: ${{ vars.INGEST_MIN_CONFIDENCE || '0.6' }}
          # Demo: link the outlets' own photos (their copyright). Before going
          # live, set the repo variable INGEST_SOURCE_IMAGES to 'false'.
          INGEST_SOURCE_IMAGES: ${{ vars.INGEST_SOURCE_IMAGES || 'true' }}
        run: >
          npm run ingest -w apps/api --
          --trigger cron
          --max ${{ inputs.max || '10' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
      # English site: translate newly published (or since-edited) stories.
      # Runs even if the news step failed, so translations never fall behind.
      - name: Translate published stories to English
        if: ${{ always() && !inputs.dry_run }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_PRIMARY_MODEL: ${{ vars.AI_PRIMARY_MODEL || 'gemini-flash-lite-latest' }}
          AI_FALLBACK_MODEL: ${{ vars.AI_FALLBACK_MODEL || 'openai/gpt-oss-120b' }}
        run: npm run translate -w apps/api -- --limit 40
      # Photos still on an outlet's site (a draft whose upload failed) get a
      # Cloudinary copy, so the site can serve them resized. Same photo and credit.
      - name: Copy outlet photos to Cloudinary
        if: ${{ always() && !inputs.dry_run }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: npm run images:backfill -w apps/api -- --rehost --limit 30
